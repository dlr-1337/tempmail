# Fail2Ban filter for tempmail HTTP 429 bursts.
#
# Matches JSON-shaped log lines whose `statusCode` is 429 and whose
# `remoteAddress` / `ip` carries the offending peer. Both key names are
# allowlisted because Fastify's request log and our own rate-limit
# emissions use slightly different field names over time.

[Definition]
failregex = ^.*"(?:remoteAddress|ip)":"<HOST>".*"statusCode":429
            ^.*"statusCode":429.*"(?:remoteAddress|ip)":"<HOST>"
ignoreregex =

datepattern = "time":%%s
