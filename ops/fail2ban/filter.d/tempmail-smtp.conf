# Fail2Ban filter for tempmail SMTP abuse events.
#
# Matches JSON-shaped log lines emitted by `src/smtp/log.ts` where the remote
# IP returned an error code (550 / 452 / 554). Pattern fields are the
# PII-safe whitelist from Phase 4 D-26.
#
# Tested pino output shape (single-line JSON):
#   {"level":30,..., "sender_ip":"198.51.100.7", "smtp_code":550, ...}
#
# <HOST> is fail2ban's built-in IP extractor token. We anchor on the
# "sender_ip":"..." field before smtp_code so we don't accidentally ban the
# server's own bind address.

[Definition]
failregex = ^.*"sender_ip":"<HOST>".*"smtp_code":(452|550|554)
ignoreregex =

# Ship date-detection hints — pino emits `"time":<epoch_ms>` by default.
datepattern = "time":%%s
