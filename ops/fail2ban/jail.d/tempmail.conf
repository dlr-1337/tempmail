# tempmail fail2ban jails (Phase 6 / ABUSE-05).
#
# Operators drop this file into `/etc/fail2ban/jail.d/` alongside the
# companion filter.d/tempmail-smtp.conf + tempmail-http.conf. Adjust
# `logpath` to match your log destination (defaults assume systemd journald
# with `backend = systemd`).
#
# Thresholds (D-29): findtime=10min, maxretry=20, bantime=1hr.

[tempmail-smtp]
enabled  = true
filter   = tempmail-smtp
backend  = systemd
journalmatch = _SYSTEMD_UNIT=tempmail.service
findtime = 600
maxretry = 20
bantime  = 3600
action   = iptables-multiport[name=tempmail-smtp, port="25,465,587", protocol=tcp]

[tempmail-http]
enabled  = true
filter   = tempmail-http
backend  = systemd
journalmatch = _SYSTEMD_UNIT=tempmail.service
findtime = 600
maxretry = 20
bantime  = 3600
action   = iptables-multiport[name=tempmail-http, port="80,443", protocol=tcp]
